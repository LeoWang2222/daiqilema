<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="出门前点一点，再也不落东西。手机、钥匙、工牌……分类清单帮你带齐。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="带齐了吗">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12141b">
<title>带齐了吗？</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --card2: #f0f1f7;
    --accent: #6C5CE7;
    --accent2: #8e7bff;
    --green: #2dd4a7;
    --text: #1d1f2a;
    --sub: #8a8f9e;
    --line: #e6e8f0;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== Pages ===== */
  .page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    transition: transform .38s cubic-bezier(.32,.72,.28,1), opacity .38s;
    padding-top: env(safe-area-inset-top);
  }
  #page-detail {
    transform: translateX(100%);
    z-index: 10;
  }
  #page-detail.open { transform: translateX(0); }

  /* ===== Header ===== */
  header {
    padding: 28px 24px 14px;
    flex-shrink: 0;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; }
  h1 {
    font-size: 32px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(120deg, #2d2b45, var(--accent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--sub); font-size: 14px; margin-top: 6px; }
  .head-btn {
    width: 40px; height: 40px; border-radius: 14px;
    background: var(--card); border: none; color: var(--text);
    font-size: 20px; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(60,60,120,.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
    line-height: 1;
  }
  .head-btn:active { transform: scale(.9); }

  /* ===== Scroll area ===== */
  .scroll {
    flex: 1; overflow-y: auto; padding: 8px 20px 120px;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== Category cards ===== */
  .cat-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    transition: transform .18s ease, background .2s;
    box-shadow: 0 4px 16px rgba(60,60,120,.08);
    position: relative;
    overflow: hidden;
  }
  .cat-card:active { transform: scale(.965); background: var(--card2); }
  .cat-icon {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; flex-shrink: 0;
  }
  .cat-info { flex: 1; min-width: 0; }
  .cat-name-row { display: flex; align-items: center; gap: 8px; }
  .cat-name { font-size: 18px; font-weight: 700; }
  .daily-badge {
    font-size: 11px; font-weight: 700; color: var(--accent);
    background: rgba(108,92,231,.1);
    padding: 2px 8px; border-radius: 100px;
    flex-shrink: 0;
  }
  .cat-progress-text { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .cat-progress-text.done { color: #0fa77e; font-weight: 600; }
  .progress-bar {
    height: 6px; border-radius: 3px; background: #e8eaf3;
    margin-top: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width .5s cubic-bezier(.32,.72,.28,1);
  }
  .progress-fill.full { background: linear-gradient(90deg, var(--green), #5ee8c5); }
  .cat-del {
    width: 34px; height: 34px; border-radius: 12px;
    border: none; background: transparent; color: #c3c7d4;
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, color .2s;
  }
  .cat-del:active { background: rgba(255,90,90,.12); color: #ff6b6b; }

  /* ===== Item rows ===== */
  .item-row {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
    transition: background .3s, opacity .3s;
    box-shadow: 0 3px 12px rgba(60,60,120,.07);
  }
  .item-row.enter { animation: slideIn .3s cubic-bezier(.32,.72,.28,1) backwards; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .item-row.checked { background: #f2f3f9; }
  .item-row.checked .item-name { color: var(--sub); text-decoration: line-through; text-decoration-color: var(--green); }
  .check-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid #d5d9e6;
    background: #fff; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .check-btn svg { width: 18px; height: 18px; opacity: 0; transform: scale(.3); transition: all .25s cubic-bezier(.34,1.56,.64,1); }
  .item-row.checked .check-btn {
    background: linear-gradient(135deg, var(--green), #45e0b8);
    border-color: transparent;
    box-shadow: 0 0 14px rgba(45,212,167,.45);
    transform: scale(1.05);
  }
  .item-row.checked .check-btn svg { opacity: 1; transform: scale(1); }
  .check-btn:active { transform: scale(.85); }
  .item-name { flex: 1; font-size: 17px; font-weight: 600; transition: color .3s; word-break: break-all; }
  .item-del {
    width: 32px; height: 32px; border-radius: 10px; border: none;
    background: transparent; color: #c3c7d4; font-size: 16px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .item-del:active { color: #ff6b6b; }

  /* ===== Empty state ===== */
  .empty {
    text-align: center; padding: 70px 30px; color: var(--sub);
  }
  .empty .emoji { font-size: 52px; display: block; margin-bottom: 14px; }
  .empty p { font-size: 15px; line-height: 1.7; }

  /* ===== FAB ===== */
  .fab {
    position: fixed;
    right: 22px;
    bottom: calc(env(safe-area-inset-bottom) + 26px);
    width: 62px; height: 62px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; font-size: 30px; font-weight: 300;
    cursor: pointer; z-index: 50;
    box-shadow: 0 8px 24px rgba(108,92,231,.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    line-height: 1;
    padding-bottom: 3px;
  }
  .fab:active { transform: scale(.88); }

  /* ===== Detail header ===== */
  .detail-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 6px;
    flex-shrink: 0;
  }
  .back-btn {
    width: 40px; height: 40px; border-radius: 14px;
    background: var(--card); border: none; color: var(--text);
    font-size: 18px; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(60,60,120,.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .back-btn:active { transform: scale(.9); }
  .detail-title { flex: 1; min-width: 0; }
  .detail-title h2 { font-size: 22px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-title .sub { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .reset-btn {
    padding: 10px 16px; border-radius: 14px;
    background: var(--card); border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(60,60,120,.08);
    transition: transform .15s;
  }
  .reset-btn:active { transform: scale(.92); }
  .reset-btn.on { background: rgba(108,92,231,.12); color: var(--accent); font-weight: 700; }

  /* ===== Big check-all button ===== */
  .checkall-wrap { padding: 4px 20px 0; flex-shrink: 0; }
  .checkall-btn {
    width: 100%; padding: 18px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(108,92,231,.35);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .checkall-btn:active { transform: scale(.97); }
  .checkall-btn.all-done {
    background: linear-gradient(135deg, var(--green), #45e0b8);
    box-shadow: 0 6px 20px rgba(45,212,167,.35);
  }

  /* ===== Modal ===== */
  .modal-mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(40,40,70,.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s;
  }
  .modal-mask.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 480px;
    background: var(--card);
    border-radius: 28px 28px 0 0;
    padding: 26px 24px calc(env(safe-area-inset-bottom) + 26px);
    transform: translateY(100%);
    transition: transform .38s cubic-bezier(.32,.72,.28,1);
  }
  .modal-mask.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 20px; font-weight: 800; margin-bottom: 18px; }
  .modal input[type="text"] {
    width: 100%; padding: 16px 18px;
    border-radius: 16px; border: 2px solid var(--line);
    background: var(--bg); color: var(--text);
    font-size: 17px; outline: none;
    transition: border-color .2s;
    -webkit-user-select: text; user-select: text;
  }
  .modal input[type="text"]:focus { border-color: var(--accent); background:#fff; }
  .tpl-label { font-size: 13px; color: var(--sub); margin-top: 16px; }
  .tpl-row {
    display: flex; gap: 8px; margin-top: 10px;
    flex-wrap: wrap;
  }
  .tpl-chip {
    padding: 9px 14px; border-radius: 100px;
    border: 1.5px solid var(--line); background: var(--bg);
    font-size: 14px; font-weight: 600; color: var(--text);
    cursor: pointer;
    transition: transform .15s, border-color .2s, background .2s;
  }
  .tpl-chip:active { transform: scale(.92); }
  .tpl-chip.sel { border-color: var(--accent); background: rgba(108,92,231,.1); color: var(--accent); }
  .emoji-row {
    display: flex; gap: 10px; margin: 16px 0 4px;
    flex-wrap: wrap;
  }
  .emoji-pick {
    width: 46px; height: 46px; border-radius: 14px;
    border: 2px solid transparent;
    background: var(--bg); font-size: 23px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, border-color .2s;
  }
  .emoji-pick:active { transform: scale(.88); }
  .emoji-pick.sel { border-color: var(--accent); background: rgba(108,92,231,.08); }
  .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
  .btn-cancel, .btn-ok {
    flex: 1; padding: 16px; border-radius: 16px; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .15s;
  }
  .btn-cancel { background: #eceef5; color: var(--sub); }
  .btn-ok {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 14px rgba(108,92,231,.3);
  }
  .btn-cancel:active, .btn-ok:active { transform: scale(.95); }
  .settings-tip { font-size: 13px; color: var(--sub); line-height: 1.6; margin: -8px 0 16px; }
  .sheet-btn {
    width: 100%; padding: 16px; border-radius: 16px;
    border: none; background: var(--card2); color: var(--text);
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 10px; text-align: center;
    transition: transform .15s;
  }
  .sheet-btn:active { transform: scale(.97); }
  .sheet-btn.wide { margin-bottom: 0; margin-top: 6px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 110px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(35,38,55,.95);
    color: #fff;
    padding: 12px 22px; border-radius: 100px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: all .35s cubic-bezier(.32,.72,.28,1);
    z-index: 200;
    box-shadow: 0 8px 24px rgba(40,40,80,.3);
    white-space: nowrap;
    display: flex; align-items: center; gap: 12px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast-undo {
    display: none; border: none; cursor: pointer;
    background: rgba(255,255,255,.16); color: #fff;
    padding: 5px 14px; border-radius: 100px;
    font-size: 13px; font-weight: 700;
    pointer-events: auto;
  }
  .toast.can-undo .toast-undo { display: inline-block; }

  /* celebrate burst */
  .burst {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%,-50%) scale(.5);
    font-size: 60px; z-index: 150; pointer-events: none;
    opacity: 0;
    transition: all .5s cubic-bezier(.34,1.56,.64,1);
  }
  .burst.show { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }

  /* ===== Dark mode ===== */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141b;
      --card: #1c1f2b;
      --card2: #252a3a;
      --text: #eef0f8;
      --sub: #9299b0;
      --line: #2e3448;
    }
    html { color-scheme: dark; }
    h1 { background: linear-gradient(120deg, #dfe3ff, var(--accent2)); -webkit-background-clip: text; background-clip: text; }
    .cat-card, .item-row { box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .progress-bar { background: #262b3d; }
    .item-row.checked { background: #232737; }
    .check-btn { background: var(--card); border-color: #3a4159; }
    .back-btn, .reset-btn, .head-btn { box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .reset-btn.on { background: rgba(142,123,255,.16); color: var(--accent2); }
    .btn-cancel { background: #262b3d; color: var(--sub); }
    .modal input[type="text"]:focus { background: var(--card2); }
    .toast { background: rgba(58,63,88,.96); }
  }
</style>
</head>
<body>

<!-- ===== Home page: categories ===== -->
<div class="page" id="page-home">
  <header>
    <div class="title-row">
      <h1>带齐了吗？</h1>
      <button class="head-btn" id="btn-settings" aria-label="备份与恢复">⋯</button>
    </div>
    <div class="subtitle">出门前点一点，再也不落东西 ✨</div>
  </header>
  <div class="scroll" id="cat-list"></div>
  <button class="fab" id="fab-add-cat" aria-label="添加分类">+</button>
</div>

<!-- ===== Detail page: items ===== -->
<div class="page" id="page-detail">
  <div class="detail-head">
    <button class="back-btn" id="btn-back">‹</button>
    <div class="detail-title">
      <h2 id="detail-name">分类</h2>
      <div class="sub" id="detail-sub"></div>
    </div>
    <button class="reset-btn" id="btn-daily" title="每天第一次打开时，自动清空勾选">每天</button>
    <button class="reset-btn" id="btn-reset">重置</button>
  </div>
  <div class="checkall-wrap">
    <button class="checkall-btn" id="btn-checkall">一键全带齐 ✓</button>
  </div>
  <div class="scroll" id="item-list"></div>
  <button class="fab" id="fab-add-item" aria-label="添加物品">+</button>
</div>

<!-- ===== Add modal ===== -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <h3 id="modal-title">添加</h3>
    <input type="text" id="modal-input" placeholder="输入名称…" maxlength="20" autocomplete="off">
    <div id="tpl-wrap" style="display:none">
      <div class="tpl-label">从模板一键创建（自带常用物品）</div>
      <div class="tpl-row" id="tpl-row"></div>
    </div>
    <div class="emoji-row" id="emoji-row" style="display:none"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">取消</button>
      <button class="btn-ok" id="modal-ok">添加</button>
    </div>
  </div>
</div>

<!-- ===== Settings modal ===== -->
<div class="modal-mask" id="settings-mask">
  <div class="modal">
    <h3>备份与恢复</h3>
    <p class="settings-tip">清单只保存在这台设备上。换手机或清除浏览器数据前，记得先导出备份。</p>
    <button class="sheet-btn" id="btn-export">📤 导出备份（.json 文件）</button>
    <button class="sheet-btn" id="btn-import">📥 从备份文件导入</button>
    <button class="btn-cancel sheet-btn wide" id="settings-close">关闭</button>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none">
  </div>
</div>

<div class="burst" id="burst">🎉</div>
<div class="toast" id="toast"><span id="toast-msg"></span><button class="toast-undo" id="toast-undo" type="button">撤销</button></div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'daiqilema_v1';
  var EMOJIS = ['💼','🏠','🛒','🏋️','✈️','🏕️','📚','💊','👶','🐶','🚗','🎒'];
  var TEMPLATES = [
    { name: '出差', icon: '✈️', items: ['身份证','手机充电器','充电宝','笔记本电脑','耳机','换洗衣物','洗漱包'] },
    { name: '旅行', icon: '🧳', items: ['身份证','充电器','换洗衣物','洗漱包','防晒霜','雨伞','常用药','充电宝'] },
    { name: '健身', icon: '🏋️', items: ['运动鞋','毛巾','水杯','耳机','换洗衣物'] },
    { name: '露营', icon: '🏕️', items: ['帐篷','睡袋','防潮垫','手电筒','防蚊液','饮用水','炉具'] },
    { name: '上学', icon: '🎒', items: ['书包','课本','文具盒','水杯','作业本','钥匙'] },
    { name: '带娃', icon: '👶', items: ['奶瓶','纸尿裤','湿巾','备用衣服','小玩具','推车'] }
  ];

  // ---------- State ----------
  var state = load();
  var currentCatId = null;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      cats: [
        { id: uid(), name: '上班', icon: '💼', autoReset: true, lastResetOn: null, items: [
          { id: uid(), name: '手机', checked: false },
          { id: uid(), name: '钥匙', checked: false },
          { id: uid(), name: '工牌', checked: false },
          { id: uid(), name: '耳机', checked: false }
        ]},
        { id: uid(), name: '购物清单', icon: '🛒', autoReset: false, lastResetOn: null, items: [] }
      ]
    };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var catList = $('cat-list'), itemList = $('item-list');
  var pageDetail = $('page-detail');
  var modalMask = $('modal-mask'), modalInput = $('modal-input'), modalTitle = $('modal-title');
  var emojiRow = $('emoji-row'), tplWrap = $('tpl-wrap'), tplRow = $('tpl-row');
  var settingsMask = $('settings-mask');
  var toastEl = $('toast'), toastMsg = $('toast-msg'), toastUndoBtn = $('toast-undo');
  var burst = $('burst');

  var modalMode = null; // 'cat' | 'item'
  var pickedEmoji = EMOJIS[0];
  var pendingTpl = null;

  // ---------- Helpers ----------
  function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms || 10); }
  function showToast(msg, undoFn) {
    toastMsg.textContent = msg;
    toastEl.classList.toggle('can-undo', !!undoFn);
    toastUndoBtn.onclick = undoFn ? function () {
      clearTimeout(toastEl._t);
      toastEl.classList.remove('show');
      undoFn();
    } : null;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, undoFn ? 5000 : 1800);
  }
  function celebrate() {
    burst.classList.remove('show');
    void burst.offsetWidth;
    burst.classList.add('show');
    setTimeout(function () { burst.classList.remove('show'); }, 900);
    vibrate(30);
  }
  function findCat(id) {
    for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i];
    return null;
  }
  var ICON_COLORS = ['#6C5CE7','#e17055','#00b894','#0984e3','#e84393','#e1a400','#00cec9','#d63031','#8e7bff','#2dd4a7','#ff7675','#74b9ff'];
  function iconColor(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return ICON_COLORS[h % ICON_COLORS.length];
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 每日自动重置：跨天第一次碰到这个分类时清空勾选
  function applyDailyReset(cat) {
    if (!cat || !cat.autoReset || cat.lastResetOn === todayKey()) return false;
    var had = cat.items.some(function (it) { return it.checked; });
    cat.items.forEach(function (it) { it.checked = false; });
    cat.lastResetOn = todayKey();
    save();
    return had;
  }

  // 打开分类时，未确认的排前面，一眼看到还差什么
  function sinkChecked(cat) {
    var first = [], rest = [];
    cat.items.forEach(function (it) { (it.checked ? rest : first).push(it); });
    if (first.length && rest.length) {
      cat.items = first.concat(rest);
      save();
    }
  }

  // ---------- Render: categories ----------
  function renderCats() {
    catList.innerHTML = '';
    if (!state.cats.length) {
      catList.innerHTML = '<div class="empty"><span class="emoji">🎒</span><p>还没有分类<br>点右下角 + 新建一个吧，比如「上班」「健身」</p></div>';
      return;
    }
    state.cats.forEach(function (cat) {
      var total = cat.items.length;
      var done = cat.items.filter(function (it) { return it.checked; }).length;
      var pct = total ? Math.round(done / total * 100) : 0;
      var allDone = total > 0 && done === total;

      var card = document.createElement('div');
      card.className = 'cat-card';
      var color = iconColor(cat.name);
      card.innerHTML =
        '<div class="cat-icon" style="background:' + color + '18">' + (cat.icon || '📋') + '</div>' +
        '<div class="cat-info">' +
          '<div class="cat-name-row">' +
            '<div class="cat-name">' + esc(cat.name) + '</div>' +
            (cat.autoReset ? '<span class="daily-badge">每天重置</span>' : '') +
          '</div>' +
          '<div class="cat-progress-text' + (allDone ? ' done' : '') + '">' +
            (total === 0 ? '还没有物品' : allDone ? '✓ 全部带齐啦！' : done + ' / ' + total + ' 已确认') +
          '</div>' +
          '<div class="progress-bar"><div class="progress-fill' + (allDone ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<button class="cat-del" aria-label="删除">✕</button>';

      card.addEventListener('click', function (e) {
        if (e.target.classList.contains('cat-del')) return;
        vibrate(8);
        openCat(cat.id);
      });
      card.querySelector('.cat-del').addEventListener('click', function (e) {
        e.stopPropagation();
        vibrate(8);
        var idx = state.cats.indexOf(cat);
        if (idx < 0) return;
        state.cats.splice(idx, 1);
        save(); renderCats();
        showToast('已删除「' + cat.name + '」', function () {
          state.cats.splice(Math.min(idx, state.cats.length), 0, cat);
          save(); renderCats();
        });
      });
      catList.appendChild(card);
    });
  }

  // ---------- Render: detail ----------
  function updateDetailBar(cat) {
    var total = cat.items.length;
    var done = cat.items.filter(function (it) { return it.checked; }).length;
    $('detail-sub').textContent = total === 0 ? '添加需要带的东西' : (done === total ? '🎉 全部带齐，出发！' : '已确认 ' + done + ' / ' + total);

    var allBtn = $('btn-checkall');
    var allDone = total > 0 && done === total;
    allBtn.textContent = allDone ? '全部带齐啦 🎉' : '一键全带齐 ✓';
    allBtn.classList.toggle('all-done', allDone);
    allBtn.style.opacity = total === 0 ? '.4' : '1';
  }

  // animateId: 'all' = 进场动画（打开分类时）；某条目 id = 只给新加的那条动画；其余情况不播动画
  function renderDetail(animateId) {
    var cat = findCat(currentCatId);
    if (!cat) { closeDetail(); return; }
    $('detail-name').textContent = (cat.icon ? cat.icon + ' ' : '') + cat.name;
    $('btn-daily').classList.toggle('on', !!cat.autoReset);
    updateDetailBar(cat);

    itemList.innerHTML = '';
    if (!cat.items.length) {
      itemList.innerHTML = '<div class="empty"><span class="emoji">📝</span><p>这个分类还是空的<br>点右下角 + 添加要带的东西</p></div>';
      return;
    }
    cat.items.forEach(function (item, i) {
      var row = document.createElement('div');
      row.className = 'item-row' + (item.checked ? ' checked' : '');
      if (animateId === 'all' || item.id === animateId) {
        row.classList.add('enter');
        if (animateId === 'all') row.style.animationDelay = Math.min(i * 35, 350) + 'ms';
      }
      row.innerHTML =
        '<button class="check-btn" aria-label="确认">' +
          '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L10 18.5 L20 6.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</button>' +
        '<div class="item-name">' + esc(item.name) + '</div>' +
        '<button class="item-del" aria-label="删除">✕</button>';

      row.querySelector('.check-btn').addEventListener('click', function () {
        item.checked = !item.checked;
        vibrate(item.checked ? 15 : 6);
        save();
        row.classList.toggle('checked', item.checked);
        updateDetailBar(cat);
        if (item.checked) {
          var t = cat.items.length;
          var d = cat.items.filter(function (it) { return it.checked; }).length;
          if (t > 0 && d === t) { celebrate(); showToast('🎉 全部带齐，放心出发！'); }
        }
      });
      row.querySelector('.item-del').addEventListener('click', function () {
        vibrate(8);
        var idx = cat.items.indexOf(item);
        if (idx < 0) return;
        cat.items.splice(idx, 1);
        save(); renderDetail();
        showToast('已删除「' + item.name + '」', function () {
          var c = findCat(cat.id);
          if (!c) return;
          c.items.splice(Math.min(idx, c.items.length), 0, item);
          save();
          if (c.id === currentCatId) renderDetail();
        });
      });
      itemList.appendChild(row);
    });
  }

  // ---------- Navigation ----------
  function openCat(id) {
    currentCatId = id;
    var cat = findCat(id);
    if (cat) {
      if (applyDailyReset(cat)) showToast('☀️ 新的一天，清单已自动重置');
      sinkChecked(cat);
    }
    renderDetail('all');
    pageDetail.classList.add('open');
  }
  function closeDetail() {
    pageDetail.classList.remove('open');
    currentCatId = null;
    renderCats();
  }
  $('btn-back').addEventListener('click', function () { vibrate(6); closeDetail(); });

  $('btn-reset').addEventListener('click', function () {
    var cat = findCat(currentCatId);
    if (!cat || !cat.items.length) return;
    vibrate(10);
    cat.items.forEach(function (it) { it.checked = false; });
    save(); renderDetail();
    showToast('已重置，重新点一遍吧');
  });

  $('btn-daily').addEventListener('click', function () {
    var cat = findCat(currentCatId);
    if (!cat) return;
    vibrate(10);
    cat.autoReset = !cat.autoReset;
    if (cat.autoReset) {
      cat.lastResetOn = todayKey();
      var had = cat.items.some(function (it) { return it.checked; });
      cat.items.forEach(function (it) { it.checked = false; });
      showToast(had ? '已开启：明天打开会自动清零' : '已开启每天自动重置');
    } else {
      showToast('已关闭每天自动重置');
    }
    save(); renderDetail();
  });

  $('btn-checkall').addEventListener('click', function () {
    var cat = findCat(currentCatId);
    if (!cat || !cat.items.length) return;
    var allDone = cat.items.every(function (it) { return it.checked; });
    vibrate(20);
    cat.items.forEach(function (it) { it.checked = !allDone; });
    save(); renderDetail();
    if (!allDone) { celebrate(); showToast('🎉 全部带齐，放心出发！'); }
  });

  // ---------- Add modal ----------
  function openModal(mode) {
    modalMode = mode;
    pendingTpl = null;
    modalInput.value = '';
    if (mode === 'cat') {
      modalTitle.textContent = '新建分类';
      modalInput.placeholder = '例如：上班、下班、买菜…';
      pickedEmoji = EMOJIS[0];
      tplWrap.style.display = 'block';
      renderTplRow();
      emojiRow.style.display = 'flex';
      renderEmojiRow();
    } else {
      modalTitle.textContent = '添加物品';
      modalInput.placeholder = '例如：钥匙、工牌、充电器…';
      tplWrap.style.display = 'none';
      emojiRow.style.display = 'none';
    }
    modalMask.classList.add('open');
    setTimeout(function () { modalInput.focus(); }, 380);
  }
  function closeModal() {
    modalMask.classList.remove('open');
    modalInput.blur();
  }
  function renderTplRow() {
    tplRow.innerHTML = '';
    TEMPLATES.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tpl-chip' + (pendingTpl === t ? ' sel' : '');
      b.textContent = t.icon + ' ' + t.name;
      b.addEventListener('click', function () {
        vibrate(6);
        if (pendingTpl === t) { pendingTpl = null; b.classList.remove('sel'); return; }
        pendingTpl = t;
        modalInput.value = t.name;
        pickedEmoji = t.icon;
        renderTplRow();
        renderEmojiRow();
      });
      tplRow.appendChild(b);
    });
  }
  function renderEmojiRow() {
    emojiRow.innerHTML = '';
    EMOJIS.forEach(function (em) {
      var b = document.createElement('button');
      b.className = 'emoji-pick' + (em === pickedEmoji ? ' sel' : '');
      b.type = 'button';
      b.textContent = em;
      b.addEventListener('click', function () {
        pickedEmoji = em;
        vibrate(6);
        emojiRow.querySelectorAll('.emoji-pick').forEach(function (x) { x.classList.remove('sel'); });
        b.classList.add('sel');
      });
      emojiRow.appendChild(b);
    });
  }

  $('fab-add-cat').addEventListener('click', function () { vibrate(10); openModal('cat'); });
  $('fab-add-item').addEventListener('click', function () { vibrate(10); openModal('item'); });
  $('modal-cancel').addEventListener('click', closeModal);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeModal(); });

  function submitModal() {
    var name = modalInput.value.trim();
    if (!name) { modalInput.focus(); return; }
    vibrate(12);
    if (modalMode === 'cat') {
      var items = pendingTpl ? pendingTpl.items.map(function (n) {
        return { id: uid(), name: n, checked: false };
      }) : [];
      state.cats.push({ id: uid(), name: name, icon: pickedEmoji, autoReset: false, lastResetOn: null, items: items });
      save(); renderCats();
      showToast(pendingTpl ? '已创建「' + name + '」，' + items.length + ' 件物品待确认' : '已添加分类「' + name + '」');
    } else {
      var cat = findCat(currentCatId);
      if (cat) {
        var nid = uid();
        cat.items.push({ id: nid, name: name, checked: false });
        save(); renderDetail(nid);
      }
    }
    closeModal();
  }
  $('modal-ok').addEventListener('click', submitModal);
  modalInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitModal(); });

  // ---------- Settings: backup & restore ----------
  $('btn-settings').addEventListener('click', function () { vibrate(8); settingsMask.classList.add('open'); });
  function closeSettings() { settingsMask.classList.remove('open'); }
  $('settings-close').addEventListener('click', closeSettings);
  settingsMask.addEventListener('click', function (e) { if (e.target === settingsMask) closeSettings(); });

  $('btn-export').addEventListener('click', function () {
    var payload = { app: 'daiqilema', version: 1, exportedAt: new Date().toISOString(), cats: state.cats };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '带齐了吗备份-' + todayKey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    closeSettings();
    showToast('备份文件已导出');
  });

  function normalizeCat(c) {
    if (!c || typeof c.name !== 'string' || !c.name.trim()) return null;
    return {
      id: uid(),
      name: c.name.trim().slice(0, 20),
      icon: (typeof c.icon === 'string' && c.icon) ? c.icon : '📋',
      autoReset: !!c.autoReset,
      lastResetOn: null,
      items: (Array.isArray(c.items) ? c.items : []).map(function (it) {
        var n = it && typeof it.name === 'string' ? it.name.trim().slice(0, 20) : '';
        return { id: uid(), name: n || '物品', checked: !!(it && it.checked) };
      })
    };
  }

  $('btn-import').addEventListener('click', function () { $('import-file').click(); });
  $('import-file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var rawCats = Array.isArray(data) ? data : (data && Array.isArray(data.cats) ? data.cats : null);
        if (!rawCats) throw new Error('bad format');
        if (!rawCats.length) { showToast('备份文件里没有分类'); return; }
        var cats = rawCats.map(normalizeCat).filter(Boolean);
        if (!cats.length) throw new Error('bad format');
        var prev = state.cats;
        state.cats = cats;
        save(); renderCats(); closeSettings();
        showToast('已导入 ' + cats.length + ' 个分类', function () {
          state.cats = prev;
          save(); renderCats();
        });
      } catch (e) {
        showToast('导入失败：文件格式不对');
      }
    };
    reader.readAsText(f);
  });

  // ---------- Offline cache ----------
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    var hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadSW) showToast('✨ 已更新到最新版本');
      hadSW = true;
    });
  }

  // ---------- Init ----------
  state.cats.forEach(function (c) { applyDailyReset(c); });
  renderCats();
})();
</script>
</body>
</html>
